[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dharmabot"
version = "0.1.0"
description = "Plataforma de inteligencia y descubrimiento de eventos psytrance a escala global (2025-2028): monitoreo continuo, clasificación por subgénero y enriquecimiento automatizado."
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "psytrance", "osint", "event-discovery",
    "web-scraping", "events", "classification",
    "music-events", "data-pipeline",
]
authors = [{ name = "Axel12358" }]
license = { text = "Proprietary — uso privado. Ver LICENSE." }
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Operating System :: MacOS",
    "Natural Language :: Spanish",
]

[project.urls]
Homepage = "https://github.com/Axel12358/dharmabot"
Repository = "https://github.com/Axel12358/dharmabot"
Issues = "https://github.com/Axel12358/dharmabot/issues"

[project.dependencies]
requests[socks]>=2.28.0
beautifulsoup4>=4.11.0
lxml>=4.9.0
PySocks>=1.7.1
duckduckgo-search>=4.0
pandas>=1.5.0
scikit-learn>=1.2.0
joblib>=1.2.0
urllib3>=1.26.0
certifi>=2022.12.0
python-dateutil>=2.8.0
pytz>=2022.7

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=8.0.0",
]

[tool.setuptools]
py-modules = ["loop_completar", "minar_fb_og"]
packages = ["core"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dharmabot"
version = "0.1.0"
description = "Pipeline OSINT y clasificación de eventos psytrance globales (2025-2028) desde fuentes públicas."
readme = "README.md"
requires-python = ">=3.10"
keywords = ["osint", "psytrance", "events", "web-scraping", "clasificacion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
]

[project.dependencies]
requests[socks]>=2.28.0
beautifulsoup4>=4.11.0
lxml>=4.9.0
PySocks>=1.7.1
duckduckgo-search>=4.0
pandas>=1.5.0
scikit-learn>=1.2.0
joblib>=1.2.0
urllib3>=1.26.0
certifi>=2022.12.0
python-dateutil>=2.8.0
pytz>=2022.7

[tool.setuptools]
py-modules = ["loop_completar", "minar_fb_og"]
packages = ["core"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
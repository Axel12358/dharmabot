name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system ruff pytest
      - name: Ruff check
        run: ruff check core/ --output-format=github
      - name: Ruff format dry-run
        run: ruff format --check core/ || true

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv pip install --system -e '.[dev]'
      - name: Compile all sources (smoke)
        run: python -m compileall -q . -x '/(\.git|\.venv|venv)/'
      - name: Run real tests (no network)
        run: uv run pytest -q --no-header -W ignore tests/test_fecha_parse.py
      - name: Import core package
        run: python -c "import core; print('core OK')"
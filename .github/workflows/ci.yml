name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * 0'

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Ruff check
        run: uvx ruff@0.14.0 check core/ --output-format=github
      - name: Ruff format check
        run: uvx ruff@0.14.0 format --check core/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Compile all sources (smoke)
        run: uv run python -m compileall -q . -x '/(\.git|\.venv|venv)/'
      - name: Run real tests (no network)
        run: uv run pytest -q --no-header -W ignore tests/test_fecha_parse.py
      - name: Import core package
        run: uv run python -c "import core; print('core OK')"
